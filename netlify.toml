# Netlify builds only the deploy previews of pull requests and branches.
# The production and staging sites deploy from GitHub Actions to Google Cloud Storage.
# A preview talks to the staging backend. Keep these values equal to .env.build.staging.

[context.deploy-preview.environment]
  VITE_SERVER_URL = "https://staging.sourcify.dev/server"
  VITE_REPOSITORY_URL = "https://repo.staging.sourcify.dev"
  VITE_VERIFY_URL = "https://verify.staging.sourcify.dev"
  VITE_TAG = "staging"
  VITE_BIGQUERY_API_URL = "https://europe-west1-sourcify-project.cloudfunctions.net/bigquery-api-staging/bigquery"
  VITE_BIGQUERY_DATASET_NAME = "sourcify_staging"
  # Netlify does not serve /live/stream, so read the live feed from staging (it allows cross-origin requests).
  VITE_LIVE_STATS_URL = "https://staging.sourcify.dev/live/stream"

[context.branch-deploy.environment]
  VITE_SERVER_URL = "https://staging.sourcify.dev/server"
  VITE_REPOSITORY_URL = "https://repo.staging.sourcify.dev"
  VITE_VERIFY_URL = "https://verify.staging.sourcify.dev"
  VITE_TAG = "staging"
  VITE_BIGQUERY_API_URL = "https://europe-west1-sourcify-project.cloudfunctions.net/bigquery-api-staging/bigquery"
  VITE_BIGQUERY_DATASET_NAME = "sourcify_staging"
  # Netlify does not serve /live/stream, so read the live feed from staging (it allows cross-origin requests).
  VITE_LIVE_STATS_URL = "https://staging.sourcify.dev/live/stream"
