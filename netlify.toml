# Netlify builds only the deploy previews of pull requests and branches.
# The production and staging sites deploy from GitHub Actions to Google Cloud Storage.
# A preview talks to the staging backend. Keep these values equal to .env.build.staging.

[context.deploy-preview.environment]
  REACT_APP_SERVER_URL = "https://staging.sourcify.dev/server"
  REACT_APP_REPOSITORY_URL = "https://repo.staging.sourcify.dev"
  REACT_APP_VERIFY_URL = "https://verify.staging.sourcify.dev"
  REACT_APP_TAG = "staging"
  REACT_APP_BIGQUERY_API_URL = "https://europe-west1-sourcify-project.cloudfunctions.net/bigquery-api-staging/bigquery"
  REACT_APP_BIGQUERY_DATASET_NAME = "sourcify_staging"
  # Netlify does not serve /live/stream, so read the live feed from staging (it allows cross-origin requests).
  # This value is not in .env.build.staging, because the staging site serves /live/stream on its own domain.
  REACT_APP_LIVE_STATS_URL = "https://staging.sourcify.dev/live/stream"

[context.branch-deploy.environment]
  REACT_APP_SERVER_URL = "https://staging.sourcify.dev/server"
  REACT_APP_REPOSITORY_URL = "https://repo.staging.sourcify.dev"
  REACT_APP_VERIFY_URL = "https://verify.staging.sourcify.dev"
  REACT_APP_TAG = "staging"
  REACT_APP_BIGQUERY_API_URL = "https://europe-west1-sourcify-project.cloudfunctions.net/bigquery-api-staging/bigquery"
  REACT_APP_BIGQUERY_DATASET_NAME = "sourcify_staging"
  # Netlify does not serve /live/stream, so read the live feed from staging (it allows cross-origin requests).
  # This value is not in .env.build.staging, because the staging site serves /live/stream on its own domain.
  REACT_APP_LIVE_STATS_URL = "https://staging.sourcify.dev/live/stream"
